<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peacekeeper Simulator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg-float" aria-hidden="true">
    <span style="left:6%;  animation-delay:0s">🕊️</span>
    <span style="left:22%; animation-delay:3s">✨</span>
    <span style="left:38%; animation-delay:6s">🕊️</span>
    <span style="left:54%; animation-delay:1.5s">✨</span>
    <span style="left:70%; animation-delay:4.5s">🕊️</span>
    <span style="left:86%; animation-delay:8s">✨</span>
  </div>

  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">🕊️ Peacekeeper Simulator</a>
    <div class="top-right">
      {% block hud %}{% endblock %}
      <button type="button" id="muteBtn" class="icon-btn" title="Sound on/off">🔊</button>
      <a href="{{ url_for('reset') }}" class="restart">↺ Restart</a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='effects.js') }}"></script>
</body>
</html>
